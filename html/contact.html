<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead 4 Change</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/card.css">
  <link rel="stylesheet" href="../css/banner.css">
  <link rel="stylesheet" href="../css/contact.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#top">Text on top left</a>
      <nav aria-label="Main">
        <ul class="nav-list">
          <li><a href="#top">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#about">Events</a></li>
          <li><a href="#sponsors">Sponsors</a></li>
          <li><a href="#contact" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="content" id="top">
    <header class="page-intro">
      <h1>Contact Us</h1>
      <p>Do you have any questions about Lead 4 Change? Reach out:</p>
    </header>

    <section class="contact-grid" aria-label="Contact options">
      <article class="contact-card" aria-labelledby="email-title">
        <div class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="m4 7 8 6 8-6"></path>
          </svg>
        </div>
        <div class="contact-card__content">
          <h2 id="email-title">Email</h2>
          <p>Questions or ideas? Send us a message.</p>
          <a class="contact-card__value" href="mailto:your-email@example.com">your-email@example.com</a>
        </div>
      </article>

      <article class="contact-card" aria-labelledby="social-title">
        <div class="contact-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="6" cy="6" r="2.5"></circle>
            <circle cx="18" cy="7" r="2.5"></circle>
            <circle cx="12" cy="18" r="2.5"></circle>
            <path d="m8.3 6.5 7.2.9M7.4 8.2l3.3 7.5m5.5-6.5-3.1 6.4"></path>
          </svg>
        </div>
        <div class="contact-card__content">
          <h2 id="social-title">Social</h2>
          <p>Connect with us and follow our updates.</p>
          <span class="contact-card__value">@your-social-handle</span>
        </div>
      </article>
    </section>
  </main>

</body>
</html>
